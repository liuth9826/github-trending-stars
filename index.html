<!DOCTYPE html>
<html lang="zh-CN" data-theme="sky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Trending Stars - 开源项目排行榜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=VT323&family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;700&family=Nunito:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Merriweather:wght@400;700&family=Archivo+Black&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #eff6ff;
            --bg-card: #ffffff;
            --text-primary: #1e40af;
            --text-secondary: #64748b;
            --accent-blue: #3b82f6;
            --border-color: #dbeafe;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            --shadow-glow: 0 4px 20px rgba(59, 130, 246, 0.15);
            --font-family: 'Outfit', sans-serif;
            --font-family-mono: 'Fira Code', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-family); background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Header */
        header { text-align: center; margin-bottom: 40px; }
        .logo { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .logo-icon { font-size: 2.5rem; }
        h1 { font-size: 2.5rem; font-weight: 700; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-secondary); font-size: 1.1rem; }
        .last-update { color: var(--text-secondary); font-size: 0.9rem; margin-top: 10px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; text-align: center; transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-glow); }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-value { font-size: 2rem; font-weight: 700; font-family: var(--font-family-mono); color: var(--accent-blue); }

        /* Tab Container */
        .tab-container { display: flex; gap: 12px; margin-bottom: 30px; justify-content: center; }
        .tab-btn { padding: 14px 28px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-secondary); font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .tab-btn:hover { border-color: var(--accent-blue); color: var(--text-primary); transform: translateY(-2px); }
        .tab-btn.active { background: var(--gradient-primary); border-color: transparent; color: white; box-shadow: var(--shadow-glow); }

        /* Skills Categories */
        .skills-categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
        .category-tag { padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; transition: all 0.2s ease; }
        .category-tag:hover { border-color: var(--accent-blue); color: var(--text-primary); }
        .category-tag.active { background: var(--gradient-primary); border-color: transparent; color: white; }

        /* Controls */
        .controls { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input { width: 100%; padding: 12px 16px 12px 44px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 1rem; background: var(--bg-primary); }
        .search-box .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; }
        .filter-group { display: flex; gap: 12px; }
        .filter-select { padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 1rem; background: var(--bg-primary); cursor: pointer; }
        .sort-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .sort-btn { padding: 10px 20px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-primary); color: var(--text-secondary); font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; }
        .sort-btn:hover { border-color: var(--accent-blue); color: var(--text-primary); }
        .sort-btn.active { background: var(--gradient-primary); border-color: transparent; color: white; }
        .refresh-btn { padding: 12px 24px; background: var(--gradient-primary); border: none; border-radius: 12px; color: white; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; margin-left: auto; }
        .refresh-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-glow); }
        .refresh-btn.spinning { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Projects Grid */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .project-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; transition: all 0.3s ease; cursor: pointer; position: relative; }
        .project-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-glow); }
        .rank-badge { position: absolute; top: -10px; left: 20px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; background: var(--bg-secondary); color: var(--text-secondary); }
        .rank-badge.rank-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: white; }
        .rank-badge.rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: white; }
        .rank-badge.rank-3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: white; }
        .project-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; padding-top: 10px; }
        .project-name { font-size: 1.2rem; font-weight: 600; color: var(--text-primary); text-decoration: none; }
        .project-name:hover { color: var(--accent-blue); }
        .project-stats { display: flex; gap: 12px; }
        .stat-item { display: flex; align-items: center; gap: 4px; font-size: 0.9rem; color: var(--text-secondary); }
        .stat-item.weekly-stars { color: var(--accent-blue); font-weight: 600; }
        .project-description { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 16px; line-height: 1.5; }
        .project-footer { display: flex; justify-content: space-between; align-items: center; }
        .project-meta { display: flex; gap: 12px; align-items: center; }
        .language-tag { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg-secondary); border-radius: 20px; font-size: 0.85rem; }
        .language-tag::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--lang-color); }
        .category-badge { padding: 4px 10px; background: var(--gradient-primary); color: white; border-radius: 20px; font-size: 0.8rem; }
        .forks-count { font-size: 0.9rem; color: var(--text-secondary); }

        /* Pagination */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 30px; }
        .page-btn { min-width: 40px; height: 40px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-card); color: var(--text-secondary); font-size: 0.95rem; cursor: pointer; transition: all 0.3s ease; }
        .page-btn:hover:not(:disabled) { border-color: var(--accent-blue); color: var(--text-primary); }
        .page-btn.active { background: var(--gradient-primary); border-color: transparent; color: white; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Loading & Error */
        .loading-container, .error-container, .empty-state { text-align: center; padding: 60px 20px; }
        .loading-spinner { width: 50px; height: 50px; border: 3px solid var(--border-color); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        .loading-text, .error-title, .empty-title { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 10px; }
        .error-icon, .empty-icon { font-size: 3rem; margin-bottom: 20px; }

        /* Chart Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--bg-card); border-radius: 20px; padding: 30px; width: 90%; max-width: 800px; max-height: 90vh; overflow: auto; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; border: none; background: var(--bg-secondary); border-radius: 50%; font-size: 1.5rem; cursor: pointer; transition: all 0.3s ease; }
        .modal-close:hover { background: var(--accent-blue); color: white; }
        .modal-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; padding-right: 50px; }
        .chart-container { height: 400px; }

        /* Theme Switcher */
        .theme-switcher { position: fixed; bottom: 30px; right: 30px; z-index: 999; }
        .theme-toggle-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--gradient-primary); border: none; color: white; font-size: 1.5rem; cursor: pointer; box-shadow: var(--shadow-glow); transition: all 0.3s ease; }
        .theme-toggle-btn:hover { transform: scale(1.1); }
        .theme-panel { position: absolute; bottom: 70px; right: 0; width: 320px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); opacity: 0; visibility: hidden; transform: translateY(20px); transition: all 0.3s ease; }
        .theme-panel.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .theme-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .theme-panel-title { font-size: 1.1rem; font-weight: 600; }
        .theme-panel-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); }
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .theme-option { padding: 12px; border: 2px solid var(--border-color); border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .theme-option:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
        .theme-option.active { border-color: var(--accent-blue); background: var(--bg-secondary); }
        .theme-preview { width: 100%; height: 40px; border-radius: 8px; margin-bottom: 8px; }
        .theme-name { font-size: 0.8rem; font-weight: 500; }

        /* ========== 主题定义 ========== */
        /* 极简白 */
        [data-theme="minimal"] {
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --bg-card: #ffffff;
            --text-primary: #000000;
            --text-secondary: #666666;
            --accent-blue: #000000;
            --border-color: #e0e0e0;
            --gradient-primary: linear-gradient(135deg, #000000 0%, #333333 100%);
            --shadow-glow: 0 4px 20px rgba(0,0,0,0.1);
            --font-family: 'DM Sans', sans-serif;
            --font-family-mono: 'Fira Code', monospace;
        }

        /* 自然绿 */
        [data-theme="nature"] {
            --bg-primary: #f0fdf4;
            --bg-secondary: #dcfce7;
            --bg-card: #ffffff;
            --text-primary: #14532d;
            --text-secondary: #166534;
            --accent-blue: #10b981;
            --border-color: #bbf7d0;
            --gradient-primary: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            --shadow-glow: 0 4px 20px rgba(16, 185, 129, 0.15);
            --font-family: 'Nunito', sans-serif;
            --font-family-mono: 'Fira Code', monospace;
        }

        /* 天空蓝 (默认) */
        [data-theme="sky"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #eff6ff;
            --bg-card: #ffffff;
            --text-primary: #1e40af;
            --text-secondary: #64748b;
            --accent-blue: #3b82f6;
            --border-color: #dbeafe;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            --shadow-glow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        /* 奶油暖 */
        [data-theme="warm"] {
            --bg-primary: #fffbeb;
            --bg-secondary: #fef3c7;
            --bg-card: #ffffff;
            --text-primary: #92400e;
            --text-secondary: #b45309;
            --accent-blue: #f59e0b;
            --border-color: #fde68a;
            --gradient-primary: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            --shadow-glow: 0 4px 20px rgba(245, 158, 11, 0.15);
            --font-family: 'Quicksand', sans-serif;
            --font-family-mono: 'Fira Code', monospace;
        }

        /* 暗夜紫 */
        [data-theme="purple"] {
            --bg-primary: #1e1b4b;
            --bg-secondary: #312e81;
            --bg-card: rgba(255,255,255,0.05);
            --text-primary: #e9d5ff;
            --text-secondary: #c4b5fd;
            --accent-blue: #a855f7;
            --border-color: rgba(168, 85, 247, 0.2);
            --gradient-primary: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            --shadow-glow: 0 0 30px rgba(168, 85, 247, 0.3);
            --font-family: 'Space Grotesk', sans-serif;
            --font-family-mono: 'Fira Code', monospace;
        }

        /* 纸艺风 */
        [data-theme="paper"] {
            --bg-primary: #fefce8;
            --bg-secondary: #fef9c3;
            --bg-card: #ffffff;
            --text-primary: #713f12;
            --text-secondary: #a16207;
            --accent-blue: #ca8a04;
            --border-color: #fde047;
            --gradient-primary: linear-gradient(135deg, #ca8a04 0%, #eab308 100%);
            --shadow-glow: 0 4px 20px rgba(202, 138, 4, 0.15);
            --font-family: 'Merriweather', serif;
            --font-family-mono: 'Fira Code', monospace;
        }

        /* 玻璃拟态 */
        [data-theme="glass"] {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: rgba(255,255,255,0.1);
            --bg-card: rgba(255,255,255,0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255,255,255,0.8);
            --accent-blue: #fff;
            --border-color: rgba(255,255,255,0.2);
            --gradient-primary: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 100%);
            --shadow-glow: 0 8px 32px rgba(31, 38, 135, 0.3);
        }

        /* 复古终端 */
        [data-theme="retro"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --bg-card: rgba(255, 176, 0, 0.05);
            --text-primary: #ffb000;
            --text-secondary: #cc8c00;
            --accent-blue: #ffb000;
            --border-color: #ffb000;
            --gradient-primary: linear-gradient(135deg, #ffb000 0%, #cc8c00 100%);
            --shadow-glow: 0 0 20px rgba(255, 176, 0, 0.3);
            --font-family: 'VT323', monospace;
        }

        /* 新粗野 */
        [data-theme="brutalist"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f0f0f0;
            --bg-card: #ffffff;
            --text-primary: #000000;
            --text-secondary: #333333;
            --accent-blue: #ff006e;
            --border-color: #000000;
            --gradient-primary: linear-gradient(135deg, #ff006e 0%, #ff4d9e 100%);
            --shadow-glow: 4px 4px 0px #000000;
            --font-family: 'Archivo Black', sans-serif;
            --font-family-mono: 'Fira Code', monospace;
        }

        /* 日式极简 */
        [data-theme="japanese"] {
            --bg-primary: #faf9f6;
            --bg-secondary: #f5f5f0;
            --bg-card: #ffffff;
            --text-primary: #2c2c2c;
            --text-secondary: #666666;
            --accent-blue: #bc002d;
            --border-color: #d4d4d4;
            --gradient-primary: linear-gradient(135deg, #bc002d 0%, #e60033 100%);
            --shadow-glow: 0 4px 20px rgba(188, 0, 45, 0.15);
            --font-family: 'Noto Sans JP', sans-serif;
            --font-family-mono: 'Fira Code', monospace;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .projects-grid { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: stretch; }
            .search-box { min-width: 100%; }
            .tab-container { flex-wrap: wrap; }
            .tab-btn { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <div class="theme-panel" id="themePanel">
            <div class="theme-panel-header">
                <div class="theme-panel-title">选择主题</div>
                <button class="theme-panel-close" id="themePanelClose">×</button>
            </div>
            <div class="theme-grid">
                <div class="theme-option active" data-theme="sky">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #3b82f6, #60a5fa);"></div>
                    <div class="theme-name">天空蓝</div>
                </div>
                <div class="theme-option" data-theme="minimal">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #000, #333);"></div>
                    <div class="theme-name">极简白</div>
                </div>
                <div class="theme-option" data-theme="nature">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #10b981, #34d399);"></div>
                    <div class="theme-name">自然绿</div>
                </div>
                <div class="theme-option" data-theme="warm">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #f59e0b, #fbbf24);"></div>
                    <div class="theme-name">奶油暖</div>
                </div>
                <div class="theme-option" data-theme="purple">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #7c3aed, #a855f7);"></div>
                    <div class="theme-name">暗夜紫</div>
                </div>
                <div class="theme-option" data-theme="paper">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #ca8a04, #eab308);"></div>
                    <div class="theme-name">纸艺风</div>
                </div>
                <div class="theme-option" data-theme="glass">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #667eea, #764ba2);"></div>
                    <div class="theme-name">玻璃拟态</div>
                </div>
                <div class="theme-option" data-theme="retro">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #ffb000, #cc8c00);"></div>
                    <div class="theme-name">复古终端</div>
                </div>
                <div class="theme-option" data-theme="brutalist">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #ff006e, #ff4d9e);"></div>
                    <div class="theme-name">新粗野</div>
                </div>
                <div class="theme-option" data-theme="japanese">
                    <div class="theme-preview" style="background: linear-gradient(135deg, #bc002d, #e60033);"></div>
                    <div class="theme-name">日式极简</div>
                </div>
            </div>
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn">🎨</button>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">⭐</div>
                <h1>GitHub Trending Stars</h1>
            </div>
            <p class="subtitle">发现本周最受关注的开源项目</p>
            <div class="last-update">最后更新: <span id="lastUpdateTime">--</span></div>
        </header>

        <!-- Tabs -->
        <div class="tab-container">
            <button class="tab-btn active" data-tab="all"><span>📊</span> 全部项目</button>
            <button class="tab-btn" data-tab="skills"><span>🤖</span> AI Skills 热榜</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总项目数</div>
                <div class="stat-value" id="totalProjects">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">本周新增 Stars</div>
                <div class="stat-value" id="totalWeeklyStars">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总 Stars 数</div>
                <div class="stat-value" id="totalStars">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label" id="statLabel4">编程语言</div>
                <div class="stat-value" id="totalLanguages">0</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索项目名称、描述或作者...">
            </div>
            <div class="filter-group">
                <select class="filter-select" id="languageFilter">
                    <option value="">所有语言</option>
                </select>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn active" data-sort="weeklyStars">🔥 本周热度</button>
                <button class="sort-btn" data-sort="totalStars">⭐ 总Star数</button>
                <button class="sort-btn" data-sort="name">📛 名称</button>
            </div>
            <button class="refresh-btn" id="refreshBtn">🔄 刷新</button>
        </div>

        <!-- Projects -->
        <div class="projects-grid" id="projectsContainer">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <div class="loading-text">正在加载数据...</div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>

    <!-- Chart Modal -->
