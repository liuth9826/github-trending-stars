<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Trending Stars - 开源项目排行榜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* 天空蓝主题配色 */
            --bg-primary: #f8fafc;
            --bg-secondary: #eff6ff;
            --bg-tertiary: #dbeafe;
            --bg-card: #ffffff;
            --text-primary: #1e40af;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-light-blue: #60a5fa;
            --accent-dark-blue: #1e40af;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --border-color: #dbeafe;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            --gradient-glow: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(96, 165, 250, 0.1) 100%);
            --shadow-glow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 50%, #ffffff 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景装饰 - 柔和的云朵效果 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .bg-decoration::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 头部区域 */
        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .last-update {
            margin-top: 15px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .last-update span {
            color: var(--accent-blue);
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: var(--shadow-glow);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
        }

        .stat-card:nth-child(1) .stat-value { color: var(--accent-blue); }
        .stat-card:nth-child(2) .stat-value { color: var(--accent-light-blue); }
        .stat-card:nth-child(3) .stat-value { color: var(--accent-dark-blue); }
        .stat-card:nth-child(4) .stat-value { color: var(--accent-green); }

        /* 控制面板 */
        .controls {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .sort-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sort-btn {
            padding: 10px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sort-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .sort-btn.active {
            background: var(--gradient-glow);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .refresh-btn {
            padding: 12px 20px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .refresh-btn.spinning .refresh-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 项目列表 */
        .projects-container {
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover {
            transform: translateX(5px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: var(--shadow-glow);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .rank-badge {
            width: 50px;
            height: 50px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .rank-badge.top-1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #1a1a1a;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .rank-badge.top-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #a0a0a0 100%);
            color: #1a1a1a;
        }

        .rank-badge.top-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #b87333 100%);
            color: #1a1a1a;
        }

        .project-info {
            flex: 1;
            min-width: 0;
        }

        .project-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .project-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .project-name:hover {
            color: var(--accent-blue);
        }

        .project-owner {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .project-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
        }

        .meta-item.stars {
            color: var(--accent-orange);
        }

        .meta-item.weekly-stars {
            color: var(--accent-green);
            font-weight: 600;
        }

        .meta-item.language {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .language-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .project-stats {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-end;
            min-width: 150px;
        }

        .stat-box {
            text-align: right;
        }

        .stat-box-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-box-value {
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .stat-box-value.weekly {
            color: var(--accent-green);
        }

        .stat-box-value.total {
            color: var(--accent-orange);
        }

        .trend-chart {
            width: 120px;
            height: 40px;
        }

        /* 加载状态 */
        .loading-container {
            text-align: center;
            padding: 80px 20px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* 错误状态 */
        .error-container {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 1.25rem;
            color: var(--accent-red);
            margin-bottom: 8px;
        }

        .error-message {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* 空状态 */
        .empty-container {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-text {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        .page-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 40px;
        }

        .page-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .page-btn.active {
            background: var(--gradient-primary);
            border-color: transparent;
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 动画 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }

            .filter-group {
                flex-direction: column;
            }

            .filter-select {
                width: 100%;
            }

            .sort-buttons {
                justify-content: center;
            }

            .project-card {
                flex-direction: column;
                gap: 16px;
            }

            .rank-badge {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .project-stats {
                flex-direction: row;
                justify-content: space-between;
                width: 100%;
                min-width: auto;
            }

            .stat-box {
                text-align: left;
            }

            .trend-chart {
                display: none;
            }

            .project-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .project-meta {
                gap: 12px;
            }
        }

        /* 图表模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 64, 175, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>

    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">⭐</div>
                <h1>GitHub Trending Stars</h1>
            </div>
            <p class="subtitle">发现本周最受关注的开源项目，追踪技术趋势与社区热度</p>
            <div class="last-update">
                最后更新: <span id="lastUpdateTime">--</span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总项目数</div>
                <div class="stat-value" id="totalProjects">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">本周新增 Stars</div>
                <div class="stat-value" id="totalWeeklyStars">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总 Stars 数</div>
                <div class="stat-value" id="totalStars">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">编程语言</div>
                <div class="stat-value" id="totalLanguages">0</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索项目名称、描述或作者...">
            </div>
            <div class="filter-group">
                <select class="filter-select" id="languageFilter">
                    <option value="">所有语言</option>
                </select>
                <select class="filter-select" id="dateRangeFilter">
                    <option value="7">最近7天</option>
                    <option value="30">最近30天</option>
                    <option value="90">最近90天</option>
                </select>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn active" data-sort="weeklyStars">
                    <span>🔥</span> 本周热度
                </button>
                <button class="sort-btn" data-sort="totalStars">
                    <span>⭐</span> 总Star数
                </button>
                <button class="sort-btn" data-sort="name">
                    <span>📛</span> 名称
                </button>
            </div>
            <button class="refresh-btn" id="refreshBtn">
                <span class="refresh-icon">🔄</span> 刷新数据
            </button>
        </div>

        <div class="projects-container" id="projectsContainer">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <div class="loading-text">正在加载 GitHub 数据...</div>
            </div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- 图表模态框 -->
    <div class="modal-overlay" id="chartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Star 增长趋势</h3>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            ITEMS_PER_PAGE: 20,
            CACHE_KEY: 'github_trending_data',
            CACHE_DURATION: 60 * 60 * 1000, // 1小时
            GITHUB_API_BASE: 'https://api.github.com',
            LANGUAGES: [
                'JavaScript', 'TypeScript', 'Python', 'Java', 'Go',
                'Rust', 'C++', 'C', 'C#', 'PHP', 'Ruby', 'Swift',
                'Kotlin', 'Scala', 'R', 'Vue', 'HTML', 'CSS', 'Shell'
            ]
        };

        // ==================== 状态管理 ====================
        const state = {
            projects: [],
            filteredProjects: [],
            currentPage: 1,
            sortBy: 'weeklyStars',
            sortOrder: 'desc',
            searchQuery: '',
            selectedLanguage: '',
            dateRange: 7,
            isLoading: false,
            chartInstance: null
        };

        // ==================== DOM 元素 ====================
        const elements = {
            projectsContainer: document.getElementById('projectsContainer'),
            pagination: document.getElementById('pagination'),
            searchInput: document.getElementById('searchInput'),
            languageFilter: document.getElementById('languageFilter'),
            dateRangeFilter: document.getElementById('dateRangeFilter'),
            refreshBtn: document.getElementById('refreshBtn'),
            lastUpdateTime: document.getElementById('lastUpdateTime'),
            totalProjects: document.getElementById('totalProjects'),
            totalWeeklyStars: document.getElementById('totalWeeklyStars'),
            totalStars: document.getElementById('totalStars'),
            totalLanguages: document.getElementById('totalLanguages'),
            chartModal: document.getElementById('chartModal'),
            modalClose: document.getElementById('modalClose'),
            modalTitle: document.getElementById('modalTitle'),
            trendChart: document.getElementById('trendChart')
        };

        // ==================== 工具函数 ====================
        const utils = {
            // 格式化数字
            formatNumber(num) {
                if (num >= 1000000) {
                    return (num / 1000000).toFixed(1) + 'M';
                } else if (num >= 1000) {
                    return (num / 1000).toFixed(1) + 'k';
                }
                return num.toString();
            },

            // 格式化日期
            formatDate(date) {
                return new Date(date).toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            },

            // 获取语言颜色
            getLanguageColor(language) {
                const colors = {
                    'JavaScript': '#f1e05a',
                    'TypeScript': '#2b7489',
                    'Python': '#3572A5',
                    'Java': '#b07219',
                    'Go': '#00ADD8',
                    'Rust': '#dea584',
                    'C++': '#f34b7d',
                    'C': '#555555',
                    'C#': '#178600',
                    'PHP': '#4F5D95',
                    'Ruby': '#701516',
                    'Swift': '#ffac45',
                    'Kotlin': '#A97BFF',
                    'Vue': '#41b883',
                    'HTML': '#e34c26',
                    'CSS': '#563d7c',
                    'Shell': '#89e051'
                };
                return colors[language] || '#8b8b9e';
            },

            // 本地存储
            storage: {
                get(key) {
                    try {
                        const item = localStorage.getItem(key);
                        return item ? JSON.parse(item) : null;
                    } catch (e) {
                        return null;
                    }
                },
                set(key, value) {
                    try {
                        localStorage.setItem(key, JSON.stringify(value));
                    } catch (e) {
                        console.error('Storage error:', e);
                    }
                },
                remove(key) {
                    try {
                        localStorage.removeItem(key);
                    } catch (e) {
                        console.error('Storage error:', e);
                    }
                }
            }
        };

        // ==================== GitHub Trending API 服务 ====================
        // 支持两种数据获取方式：
        // 1. 静态 JSON 文件（GitHub Pages 部署时使用）
        // 2. 本地代理服务器（本地开发时使用）
        const githubAPI = {
            // 获取 Trending 数据
            async getTrendingRepos(forceRefresh = false) {
                // 首先尝试从静态 JSON 获取（零成本、无限制）
                try {
                    const staticResponse = await fetch('public/data/trending.json');
                    if (staticResponse.ok) {
                        const result = await staticResponse.json();
                        return {
                            data: result.data,
                            cached: true,
                            stale: false,
                            timestamp: result.timestamp,
                            source: 'static'
                        };
                    }
                } catch (e) {
                    console.log('静态 JSON 不可用，尝试本地服务器...');
                }

                // 回退到本地代理服务器
                const endpoint = forceRefresh ? '/api/refresh' : '/api/trending';
                const response = await fetch(endpoint);

                if (!response.ok) {
                    throw new Error(`获取数据失败: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || '未知错误');
                }

                return {
                    data: result.data,
                    cached: result.cached,
                    stale: result.stale,
                    timestamp: result.timestamp,
                    source: 'server'
                };
            }
        };

        // ==================== 数据获取 ====================
        const dataService = {
            // 生成趋势数据（基于今日/本周新增 Stars）
            generateTrendData(weeklyStars) {
                const dailyAvg = Math.round(weeklyStars / 7);
                return Array.from({ length: 7 }, (_, i) => {
                    // 添加一些随机波动，让趋势更自然
                    const variation = 0.5 + Math.random();
                    return Math.max(0, Math.round(dailyAvg * variation));
                });
            },


            // 处理仓库数据
            processRepoData(repo, index) {
                // 兼容两种数据源格式
                const isStaticData = repo.fullName !== undefined;

                return {
                    id: repo.id || index + 1,
                    name: isStaticData ? repo.fullName : repo.name,
                    owner: repo.owner,
                    repo: isStaticData ? repo.name : repo.repo,
                    description: repo.description || '暂无描述',
                    language: repo.language,
                    stars: repo.stars || 0,
                    weeklyStars: repo.starsToday || repo.weeklyStars || 0,
                    forks: repo.forks || 0,
                    openIssues: 0, // Trending 页面不显示此数据
                    url: repo.url,
                    languageColor: repo.languageColor,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    // 静态数据已包含 weeklyTrend，服务器数据需要生成
                    weeklyTrend: repo.weeklyTrend || this.generateTrendData(repo.starsToday || 0)
                };
            },

            // 获取数据
            async fetchData(forceRefresh = false) {
                try {
                    // 从代理服务器获取数据
                    const result = await githubAPI.getTrendingRepos(forceRefresh);

                    if (!result.data || result.data.length === 0) {
                        throw new Error('未获取到任何仓库数据');
                    }

                    // 处理数据
                    const processedRepos = result.data
                        .map((repo, index) => this.processRepoData(repo, index))
                        .sort((a, b) => b.weeklyStars - a.weeklyStars);

                    // 保存到本地缓存
                    utils.storage.set(CONFIG.CACHE_KEY, {
                        timestamp: Date.now(),
                        data: processedRepos,
                        serverCached: result.cached,
                        serverStale: result.stale
                    });

                    return processedRepos;
                } catch (error) {
                    console.error('获取 GitHub 数据失败:', error);

                    // 如果有本地缓存，返回缓存数据
                    const cached = utils.storage.get(CONFIG.CACHE_KEY);
                    if (cached && cached.data) {
                        console.log('使用本地缓存数据');
                        return cached.data;
                    }

                    throw error;
                }
            },

            // 获取服务器状态
            async getServerStatus() {
                try {
                    const result = await githubAPI.getTrendingRepos(false);
                    return {
                        online: true,
                        cached: result.cached,
                        stale: result.stale,
                        lastUpdate: result.timestamp
                    };
                } catch (error) {
                    return {
                        online: false,
                        error: error.message
                    };
                }
            }
        };

        // ==================== UI 渲染 ====================
        const ui = {
            // 渲染项目列表
            renderProjects(projects) {
                if (projects.length === 0) {
                    elements.projectsContainer.innerHTML = `
                        <div class="empty-container">
                            <div class="empty-icon">🔍</div>
                            <div class="empty-text">没有找到匹配的项目</div>
                        </div>
                    `;
                    return;
                }

                const startIndex = (state.currentPage - 1) * CONFIG.ITEMS_PER_PAGE;
                const endIndex = startIndex + CONFIG.ITEMS_PER_PAGE;
                const pageProjects = projects.slice(startIndex, endIndex);

                elements.projectsContainer.innerHTML = pageProjects.map((project, index) => {
                    const rank = startIndex + index + 1;
                    const rankClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
                    
                    return `
                        <div class="project-card" data-id="${project.id}">
                            <div class="rank-badge ${rankClass}">${rank}</div>
                            <div class="project-info">
                                <div class="project-header">
                                    <a href="${project.url}" target="_blank" class="project-name">${project.repo}</a>
                                    <span class="project-owner">by ${project.owner}</span>
                                </div>
                                <p class="project-description">${project.description || '暂无描述'}</p>
                                <div class="project-meta">
                                    <span class="meta-item language">
                                        <span class="language-dot" style="background: ${utils.getLanguageColor(project.language)}"></span>
                                        ${project.language || 'Unknown'}
                                    </span>
                                    <span class="meta-item stars">⭐ ${utils.formatNumber(project.stars)}</span>
                                    <span class="meta-item">🍴 ${utils.formatNumber(project.forks)}</span>
                                    <span class="meta-item weekly-stars">📈 +${utils.formatNumber(project.weeklyStars)} 本周</span>
                                </div>
                            </div>
                            <div class="project-stats">
                                <div class="stat-box">
                                    <div class="stat-box-label">本周新增</div>
                                    <div class="stat-box-value weekly">+${utils.formatNumber(project.weeklyStars)}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-box-label">总 Stars</div>
                                    <div class="stat-box-value total">${utils.formatNumber(project.stars)}</div>
                                </div>
                                <canvas class="trend-chart" id="chart-${project.id}"></canvas>
                            </div>
                        </div>
                    `;
                }).join('');

                // 渲染迷你图表
                pageProjects.forEach(project => {
                    this.renderMiniChart(`chart-${project.id}`, project.weeklyTrend);
                });
            },

            // 渲染迷你趋势图
            renderMiniChart(canvasId, data) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const width = canvas.width = 120;
                const height = canvas.height = 40;

                const max = Math.max(...data);
                const min = Math.min(...data);
                const range = max - min || 1;

                ctx.clearRect(0, 0, width, height);
                
                // 绘制渐变填充
                const gradient = ctx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, 'rgba(16, 185, 129, 0.3)');
                gradient.addColorStop(1, 'rgba(16, 185, 129, 0)');

                ctx.beginPath();
                ctx.moveTo(0, height);
                
                data.forEach((value, index) => {
                    const x = (index / (data.length - 1)) * width;
                    const y = height - ((value - min) / range) * (height - 5) - 2;
                    if (index === 0) {
                        ctx.lineTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });

                ctx.lineTo(width, height);
                ctx.closePath();
                ctx.fillStyle = gradient;
                ctx.fill();

                // 绘制线条
                ctx.beginPath();
                data.forEach((value, index) => {
                    const x = (index / (data.length - 1)) * width;
                    const y = height - ((value - min) / range) * (height - 5) - 2;
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 2;
                ctx.stroke();
            },

            // 渲染分页
            renderPagination(totalItems) {
                const totalPages = Math.ceil(totalItems / CONFIG.ITEMS_PER_PAGE);
                
                if (totalPages <= 1) {
                    elements.pagination.innerHTML = '';
                    return;
                }

                let html = '';
                
                // 上一页
                html += `<button class="page-btn" ${state.currentPage === 1 ? 'disabled' : ''} onclick="app.goToPage(${state.currentPage - 1})">‹</button>`;
                
                // 页码
                const maxVisible = 5;
                let startPage = Math.max(1, state.currentPage - Math.floor(maxVisible / 2));
                let endPage = Math.min(totalPages, startPage + maxVisible - 1);
                
                if (endPage - startPage < maxVisible - 1) {
                    startPage = Math.max(1, endPage - maxVisible + 1);
                }

                if (startPage > 1) {
                    html += `<button class="page-btn" onclick="app.goToPage(1)">1</button>`;
                    if (startPage > 2) html += `<span class="page-btn" disabled>...</span>`;
                }

                for (let i = startPage; i <= endPage; i++) {
                    html += `<button class="page-btn ${i === state.currentPage ? 'active' : ''}" onclick="app.goToPage(${i})">${i}</button>`;
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) html += `<span class="page-btn" disabled>...</span>`;
                    html += `<button class="page-btn" onclick="app.goToPage(${totalPages})">${totalPages}</button>`;
                }

                // 下一页
                html += `<button class="page-btn" ${state.currentPage === totalPages ? 'disabled' : ''} onclick="app.goToPage(${state.currentPage + 1})">›</button>`;
                
                elements.pagination.innerHTML = html;
            },

            // 更新统计信息
            updateStats() {
                const totalStars = state.projects.reduce((sum, p) => sum + p.stars, 0);
                const totalWeekly = state.projects.reduce((sum, p) => sum + p.weeklyStars, 0);
                const languages = new Set(state.projects.map(p => p.language).filter(Boolean));

                elements.totalProjects.textContent = utils.formatNumber(state.projects.length);
                elements.totalStars.textContent = utils.formatNumber(totalStars);
                elements.totalWeeklyStars.textContent = '+' + utils.formatNumber(totalWeekly);
                elements.totalLanguages.textContent = languages.size;
            },

            // 更新语言筛选器
            updateLanguageFilter() {
                const languages = [...new Set(state.projects.map(p => p.language).filter(Boolean))].sort();
                const options = languages.map(lang => `<option value="${lang}">${lang}</option>`).join('');
                elements.languageFilter.innerHTML = '<option value="">所有语言</option>' + options;
            },

            // 显示加载状态
            showLoading() {
                elements.projectsContainer.innerHTML = `
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">正在加载 GitHub 数据...</div>
                    </div>
                `;
            },

            // 显示错误状态
            showError(message) {
                elements.projectsContainer.innerHTML = `
                    <div class="error-container">
                        <div class="error-icon">⚠️</div>
                        <div class="error-title">加载失败</div>
                        <div class="error-message">${message}</div>
                        <button class="refresh-btn" onclick="app.loadData()">重试</button>
                    </div>
                `;
            },

            // 显示趋势图表模态框
            showTrendChart(project) {
                elements.modalTitle.textContent = `${project.repo} - Star 增长趋势`;
                elements.chartModal.classList.add('active');

                if (state.chartInstance) {
                    state.chartInstance.destroy();
                }

                const ctx = elements.trendChart.getContext('2d');
                const labels = ['6天前', '5天前', '4天前', '3天前', '2天前', '昨天', '今天'];
                
                state.chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '每日新增 Stars',
                            data: project.weeklyTrend,
                            borderColor: '#00d4ff',
                            backgroundColor: 'rgba(0, 212, 255, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#00d4ff',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 5,
                            pointHoverRadius: 7
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.05)'
                                },
                                ticks: {
                                    color: '#8b8b9e'
                                }
                            },
                            y: {
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.05)'
                                },
                                ticks: {
                                    color: '#8b8b9e',
                                    callback: function(value) {
                                        return utils.formatNumber(value);
                                    }
                                }
                            }
                        }
                    }
                });
            },

            // 关闭模态框
            closeModal() {
                elements.chartModal.classList.remove('active');
                if (state.chartInstance) {
                    state.chartInstance.destroy();
                    state.chartInstance = null;
                }
            }
        };

        // ==================== 应用逻辑 ====================
        const app = {
            // 初始化
            async init() {
                this.bindEvents();
                await this.loadData();
            },

            // 绑定事件
            bindEvents() {
                // 搜索
                elements.searchInput.addEventListener('input', this.debounce((e) => {
                    state.searchQuery = e.target.value.toLowerCase();
                    state.currentPage = 1;
                    this.filterAndRender();
                }, 300));

                // 语言筛选
                elements.languageFilter.addEventListener('change', (e) => {
                    state.selectedLanguage = e.target.value;
                    state.currentPage = 1;
                    this.filterAndRender();
                });

                // 日期范围
                elements.dateRangeFilter.addEventListener('change', (e) => {
                    state.dateRange = parseInt(e.target.value);
                    this.loadData(true);
                });

                // 排序按钮
                document.querySelectorAll('.sort-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const sortBy = btn.dataset.sort;
                        if (state.sortBy === sortBy) {
                            state.sortOrder = state.sortOrder === 'asc' ? 'desc' : 'asc';
                        } else {
                            state.sortBy = sortBy;
                            state.sortOrder = 'desc';
                        }

                        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');

                        this.filterAndRender();
                    });
                });

                // 刷新按钮
                elements.refreshBtn.addEventListener('click', () => {
                    this.loadData(true);
                });

                // 模态框关闭
                elements.modalClose.addEventListener('click', () => {
                    ui.closeModal();
                });

                elements.chartModal.addEventListener('click', (e) => {
                    if (e.target === elements.chartModal) {
                        ui.closeModal();
                    }
                });

                // 项目卡片点击显示图表
                elements.projectsContainer.addEventListener('click', (e) => {
                    const card = e.target.closest('.project-card');
                    if (card && !e.target.closest('a')) {
                        const projectId = parseInt(card.dataset.id);
                        const project = state.projects.find(p => p.id === projectId);
                        if (project) {
                            ui.showTrendChart(project);
                        }
                    }
                });
            },

            // 防抖函数
            debounce(fn, delay) {
                let timeoutId;
                return function(...args) {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => fn.apply(this, args), delay);
                };
            },

            // 加载数据
            async loadData(forceRefresh = false) {
                if (state.isLoading) return;
                
                state.isLoading = true;
                elements.refreshBtn.disabled = true;
                elements.refreshBtn.classList.add('spinning');
                
                if (!forceRefresh) {
                    ui.showLoading();
                }

                try {
                    const data = await dataService.fetchData(forceRefresh);
                    state.projects = data;
                    state.filteredProjects = [...data];
                    
                    elements.lastUpdateTime.textContent = utils.formatDate(new Date());
                    
                    ui.updateStats();
                    ui.updateLanguageFilter();
                    this.filterAndRender();
                } catch (error) {
                    console.error('Failed to load data:', error);
                    ui.showError('无法加载数据，请检查网络连接后重试。');
                } finally {
                    state.isLoading = false;
                    elements.refreshBtn.disabled = false;
                    elements.refreshBtn.classList.remove('spinning');
                }
            },

            // 筛选和排序
            filterAndRender() {
                let result = [...state.projects];

                // 搜索筛选
                if (state.searchQuery) {
                    result = result.filter(p => 
                        p.name.toLowerCase().includes(state.searchQuery) ||
                        (p.description && p.description.toLowerCase().includes(state.searchQuery)) ||
                        p.owner.toLowerCase().includes(state.searchQuery)
                    );
                }

                // 语言筛选
                if (state.selectedLanguage) {
                    result = result.filter(p => p.language === state.selectedLanguage);
                }

                // 排序
                result.sort((a, b) => {
                    let aVal, bVal;
                    switch (state.sortBy) {
                        case 'weeklyStars':
                            aVal = a.weeklyStars;
                            bVal = b.weeklyStars;
                            break;
                        case 'totalStars':
                            aVal = a.stars;
                            bVal = b.stars;
                            break;
                        case 'name':
                            aVal = a.repo.toLowerCase();
                            bVal = b.repo.toLowerCase();
                            break;
                        default:
                            aVal = a.weeklyStars;
                            bVal = b.weeklyStars;
                    }
                    
                    if (state.sortOrder === 'asc') {
                        return aVal > bVal ? 1 : -1;
                    } else {
                        return aVal < bVal ? 1 : -1;
                    }
                });

                state.filteredProjects = result;
                ui.renderProjects(result);
                ui.renderPagination(result.length);
            },

            // 跳转到指定页
            goToPage(page) {
                state.currentPage = page;
                ui.renderProjects(state.filteredProjects);
                ui.renderPagination(state.filteredProjects.length);
                elements.projectsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        // ==================== 启动应用 ====================
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
